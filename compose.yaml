services:
  kioku:
    image: ghcr.io/flipstone/haskell-tools:debian-ghc-9.10.3-build-2026.9.10.59@sha256:693944c1fb25917484680ca1f7f4c8c8bea6ef25a9232f8119f773fe14235303
    environment:
      IN_DEV_CONTAINER: 'true'
      STACK_ROOT: /stack-root
      # Pass through the CI variable from GitHub (or set it to `true` locally
      # for debugging CI builds)
      CI:
    volumes:
      - .:${PROJECT_DIR}
      - flipstone_stack_root:/stack-root
    working_dir: ${PROJECT_DIR}

volumes:
  flipstone_stack_root:
    external: true
